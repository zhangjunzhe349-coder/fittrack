<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack</title>
<style>
:root{
  --bg:#0b0d10; --card:#15181e; --card2:#1e222a; --line:#2a2f3a;
  --tx:#eef1f6; --tx2:#8b93a5; --tx3:#5a6273;
  --lime:#c6f432; --green:#3ddc84; --blue:#5aa9ff; --purple:#a78bfa; --red:#ff6b6b; --amber:#ffb454;
  --p-green:#3ddc84; --p-blue:#5aa9ff; --p-purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.wrap{padding:0 16px}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px;position:relative}
.hd .brand{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;padding:2px 6px 2px 0;border-radius:12px;transition:opacity .15s}
.hd .brand:active{opacity:.6}
.hd .brand .mark{width:26px;height:26px;flex-shrink:0}
.hd .brand .mark svg{display:block;width:100%;height:100%}
.hd .brand h1{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.hd .brand .sub2{font-size:10.5px;color:var(--tx3);margin-top:1px;line-height:1.2}
.hd .brand .chev{margin-left:2px;font-size:10px;color:var(--tx3);transition:transform .3s cubic-bezier(.3,.9,.3,1);display:inline-block}
.hd .brand.open .chev{transform:rotate(180deg)}
.hd .gear{color:var(--tx3);font-size:18px;padding:4px}

/* month calendar — 从日期条下方原地撑开，非新页面 */
.calwrap{overflow:hidden;max-height:0;opacity:0;transition:max-height .42s cubic-bezier(.25,.9,.3,1),opacity .28s ease,margin .42s cubic-bezier(.25,.9,.3,1);margin:0}
.calwrap.open{max-height:520px;opacity:1;margin:2px 0 4px}
.calbox{background:var(--card);border-radius:16px;padding:12px 12px 10px;transform:translateY(-8px);transition:transform .42s cubic-bezier(.25,.9,.3,1)}
.calwrap.open .calbox{transform:translateY(0)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.calhead .mt{font-size:13px;font-weight:700}
.calhead .mt span{font-size:10px;color:var(--tx3);font-weight:400;margin-left:6px}
.calhead .nav2{display:flex;gap:2px}
.calhead .nav2 button{color:var(--tx2);font-size:15px;padding:2px 9px;border-radius:8px}
.calhead .nav2 button:active{background:var(--card2)}
.calhead .nav2 .jm{font-size:10.5px;color:var(--tx3);padding:2px 7px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cg-h{font-size:9.5px;color:var(--tx3);text-align:center;padding:2px 0 4px}
.cg-d{aspect-ratio:1/1.18;border-radius:9px;background:var(--bg);border:1px solid transparent;padding:3px 4px;position:relative;cursor:pointer;overflow:hidden;transition:background .15s,border-color .15s}
.cg-d.blank{background:transparent;cursor:default}
.cg-d:active{background:var(--card2)}
.cg-d .n{font-size:11px;font-weight:700;line-height:1.25;color:var(--tx2)}
.cg-d .k{font-size:8.5px;color:var(--tx3);line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden}
.cg-d .tr{position:absolute;top:2px;right:3px;font-size:7.5px;font-weight:800;color:var(--lime);letter-spacing:.3px}
.cg-d.today{border-color:var(--tx3)}
.cg-d.today .n{color:var(--tx)}
.cg-d.sel{border-color:var(--lime);background:var(--card2)}
.cg-d.sel .n{color:var(--lime)}
.cg-d.st-ok{background:rgba(198,244,50,.13)}
.cg-d.st-ok .k{color:var(--lime)}
.cg-d.st-part .k{color:var(--amber)}
.cg-d.st-over .k{color:var(--red)}
.cg-d .ebar{margin:3px 0 0}
.clegend{display:flex;gap:10px;margin-top:9px;font-size:9.5px;color:var(--tx3);flex-wrap:wrap;padding:0 2px}
.clegend i{font-style:normal;margin-right:3px}

/* day strip */
.strip{display:flex;gap:6px;margin:10px 0 14px}
.dchip{flex:1;text-align:center;padding:8px 0 9px;border-radius:12px;background:var(--card);border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.dchip.is-train{background:rgba(198,244,50,.07);border-color:rgba(198,244,50,.22)}
.dchip .w{font-size:10px;color:var(--tx3)}
.dchip .d{font-size:15px;font-weight:700;margin-top:2px}
.dchip.today{border-color:var(--line)}
.dchip.sel{background:var(--card2);border-color:var(--lime)}
.dchip.sel .w{color:var(--lime)}
.dchip .dot{width:4px;height:4px;border-radius:2px;background:var(--tx3);margin:3px auto 0}
.dchip .dot.full{background:var(--lime)}
.dchip .ebar{height:3px;border-radius:2px;background:var(--card2);margin:6px 5px 0;overflow:hidden}
.dchip .ebar i{display:block;height:100%;border-radius:2px;transition:width .4s}
.dchip .ebar.ok i{background:var(--lime)}
.dchip .ebar.part i{background:var(--amber)}
.dchip .ebar.over i{background:var(--red)}

/* hero */
.hero{background:var(--card);border-radius:20px;padding:18px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero .ring{flex:0 0 128px;position:relative}
.hero svg{display:block;transform:rotate(-90deg)}
.hero .rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero .rn b{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hero .rn span{font-size:10px;color:var(--tx2);margin-top:2px}
.hero .ml{flex:1;display:flex;flex-direction:column;gap:10px}
.mb .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.mb .row .l{color:var(--tx2)} .mb .row .l b{color:var(--tx);font-weight:700}
.mb .bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.mb .bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hero .hintline{position:absolute;left:18px;bottom:6px;font-size:10px;color:var(--tx3)}

/* section title */
.st{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.st h2{font-size:16px;font-weight:700}
.st .sub{font-size:11px;color:var(--tx3)}

/* meal card */
.meal{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.meal .mh{display:flex;align-items:center;gap:10px;cursor:pointer}
.meal .mh h3{font-size:14px;font-weight:700}
.meal .mh .tgt{font-size:10px;color:var(--tx3);flex:1;line-height:1.4}
.meal .mh .tot{font-size:11px;color:var(--tx2);background:var(--card2);padding:4px 9px;border-radius:10px;white-space:nowrap}
.meal .mh .tot b{color:var(--tx)}
.meal .body{display:none;margin-top:10px}
.meal.open .body{display:block}
.meal .mh .arr{color:var(--tx3);font-size:12px;transition:transform .2s}
.meal.open .mh .arr{transform:rotate(90deg)}
.entry{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:13px}
.entry .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .m{font-size:11px;color:var(--tx2);white-space:nowrap}
.entry .m b{color:var(--tx)}
.entry .del{color:var(--tx3);padding:2px 4px;font-size:12px}
.empty{font-size:12px;color:var(--tx3);padding:4px 0 2px}
.mealadd{width:100%;margin-top:8px;background:var(--card2);border:1px dashed var(--tx3);color:var(--tx2);border-radius:10px;padding:10px;font-size:13px;font-weight:600}
.mealadd:active{border-color:var(--lime);color:var(--lime)}

/* collapsible */
.fold{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.fold .fh{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.fold .fh h3{font-size:14px;font-weight:700}
.fold .fh .badge{font-size:11px;color:var(--tx2)}
.fold .body{display:none;margin-top:12px}
.fold.open .body{display:block}

/* supplements */
.sup{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.sup:last-child{border:none}
.sup .box{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex-shrink:0}
.sup.done .box{background:var(--lime);border-color:var(--lime);color:#111}
.sup.done span{color:var(--tx3);text-decoration:line-through}
.sup .when{margin-left:auto;font-size:10px;color:var(--tx3);text-align:right}
.water{display:flex;align-items:center;gap:12px}
.water .num{font-size:20px;font-weight:800;min-width:104px}
.water .num.ok{color:var(--lime)}
.water .bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.water .bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .4s}
.wbtns{display:flex;gap:6px;margin-top:10px}
.wbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--tx2)}
.wbtn:active{background:var(--lime);color:#111}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(11,13,16,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;padding:8px 24px calc(10px + env(safe-area-inset-bottom));z-index:50}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx3);font-size:10px;padding:4px 0}
.nav .tab .ic{font-size:19px}
.nav .tab.on{color:var(--lime)}
.fab{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--lime);color:#111;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 10px;transform:translateY(-14px);box-shadow:0 6px 20px rgba(198,244,50,.25)}
.fab:active{transform:translateY(-12px) scale(.96)}

/* bottom sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none}
.mask.show{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;background:#171a20;border-radius:22px 22px 0 0;z-index:95;transition:transform .28s cubic-bezier(.3,.9,.3,1);padding:14px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
.sheet.show{transform:translate(-50%,0)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:12px}
.mealpick{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mpick{flex:1;padding:10px 0;border-radius:12px;background:var(--card2);text-align:center;font-size:13px;color:var(--tx2)}
.mpick.on{background:var(--lime);color:#111;font-weight:700}
.pickhint{flex-basis:100%;font-size:10px;color:var(--tx3);text-align:center;margin-bottom:8px}
.srctabs{display:flex;gap:6px;margin-bottom:12px}
.srctabs button{flex:1;padding:8px 0;border-radius:10px;background:var(--card2);font-size:12.5px;color:var(--tx2)}
.srctabs button.on{background:var(--card2);border:1px solid var(--lime);color:var(--tx)}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:6px}
.qa input,.aiin input{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 10px;font-size:13px;width:100%}
.qa input[name=qfood]{grid-column:1/5}
.qa .bigsave{grid-column:1/5;background:var(--lime);color:#111;font-weight:800;font-size:14px;padding:12px;border-radius:12px}
.aiin textarea{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:13px;resize:vertical}
.aiin .tip{font-size:11px;color:var(--tx3);line-height:1.7;margin:8px 0}
.bigbtn{width:100%;background:var(--lime);color:#111;font-weight:800;font-size:14px;padding:13px;border-radius:12px;margin-top:10px}
.ghostbtn{width:100%;background:var(--card2);color:var(--tx2);font-weight:600;font-size:13px;padding:11px;border-radius:12px;margin-top:8px}
.frq{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frq button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-size:13px}
.frq button b{display:block;font-weight:600}
.frq button span{font-size:10px;color:var(--tx3)}
/* confirm list —— 对标 Cal AI 编辑屏：每个食物一张卡片，字段格子化、标签在数值下方 */
.cfm{margin-top:4px}
.cfcard{background:var(--card2);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
.cfhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cfhead input.food{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px 12px;font-size:14px;font-weight:600}
.cfhead .del{color:var(--tx3);padding:6px;font-size:14px;flex-shrink:0}
.cfgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cfgrid .cell{display:flex;flex-direction:column;align-items:center;min-width:0}
.cfgrid input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:10px 2px;font-size:13px;text-align:center;min-width:0}
.cfgrid input:focus{border-color:var(--lime);outline:none}
.cfgrid .lbl{font-size:9px;color:var(--tx3);margin-top:4px;letter-spacing:.5px;white-space:nowrap}
.cfgrid .cell.kc input{color:var(--amber);font-weight:700}

/* training */
.tcard{background:var(--card);border-radius:20px;padding:18px;margin-top:16px}
.tcard .split-tag{font-size:11px;color:var(--tx2);background:var(--card2);display:inline-block;padding:4px 10px;border-radius:10px;margin-bottom:10px}
.tcard .split-tag.rest{color:var(--amber)}
.tcard h2{font-size:18px;font-weight:800;margin-bottom:6px}
.tcard .exline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tcard .exline:last-of-type{border:none}
.tcard .exline .sets{margin-left:auto;font-size:11px;color:var(--tx2);background:var(--card2);padding:3px 9px;border-radius:8px;white-space:nowrap}
.startbtn{width:100%;background:var(--lime);color:#111;font-size:16px;font-weight:800;padding:15px;border-radius:14px;margin-top:14px}
.tstats{display:flex;gap:8px;margin-top:14px}
.tstat{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.tstat b{font-size:17px;display:block}
.tstat span{font-size:10px;color:var(--tx3)}
/* session */
.sess{margin-top:12px}
.sess .exblk{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.sess .exblk h4{font-size:14px;font-weight:700;display:flex;justify-content:space-between}
.sess .exblk h4 span{font-size:11px;color:var(--tx3);font-weight:400}
.setrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.setrow .idx{width:22px;font-size:11px;color:var(--tx3);text-align:center}
.setrow input{width:64px;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:8px;font-size:13px;text-align:center}
.setrow .done{width:36px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--tx3);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.setrow.done .done{background:var(--lime);border-color:var(--lime);color:#111}
.setrow.done input{border-color:var(--lime);color:var(--lime)}
.unitlbl{font-size:10px;color:var(--tx3)}
.restchip{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 18px;font-size:14px;font-weight:700;z-index:60;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.restchip.show{display:flex;align-items:center;gap:10px}
.restchip .adj{font-size:11px;color:var(--tx2);padding:0 4px}
.prevhint{font-size:10px;color:var(--tx3);margin-top:4px}
/* schedule / template */
.schedrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.schedrow span{width:38px;font-size:12px;color:var(--tx2)}
.schedrow select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px;font-size:13px}
.templrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.templrow input{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:9px 10px;font-size:12.5px}
.templrow input.name{flex:1} .templrow input.sets{width:76px}
.templrow .del{color:var(--tx3);padding:2px 6px}
.minibtn{background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600}

/* ===== 训练页 v3.1：日期是主角，状态只出现一次 ===== */
.daytoggle{width:100%;border-radius:20px;padding:15px 16px;background:var(--card);border:1px solid var(--line);text-align:left;transition:background .25s,border-color .25s;margin-top:2px}
.daytoggle.on{background:linear-gradient(160deg,rgba(198,244,50,.13),rgba(198,244,50,.025));border-color:rgba(198,244,50,.4)}
.daytoggle .dt-top{display:flex;align-items:center;gap:14px}
.daytoggle .dt-num{flex-shrink:0;min-width:54px;font-size:44px;font-weight:800;letter-spacing:-2.4px;line-height:.92;color:var(--tx2);transition:color .25s;font-variant-numeric:tabular-nums}
.daytoggle.on .dt-num{color:var(--lime);text-shadow:0 0 24px rgba(198,244,50,.32)}
.daytoggle .dt-meta{flex:1;min-width:0}
.daytoggle .dt-t{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.15;display:flex;align-items:center;gap:7px}
.daytoggle .dt-t .dot{width:5px;height:5px;border-radius:50%;background:var(--tx3);flex-shrink:0;transition:background .25s,box-shadow .25s}
.daytoggle.on .dt-t .dot{background:var(--lime);box-shadow:0 0 9px rgba(198,244,50,.85)}
.daytoggle .dt-s{font-size:11px;color:var(--tx2);line-height:1.5;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 状态开关：操作由控件本身表达，不再写"点一下…" */
.dt-sw{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 2px;min-width:52px}
.dt-sw .sw{display:block;width:46px;height:27px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .25s,border-color .25s}
.dt-sw .sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--tx3);transition:left .26s cubic-bezier(.34,1.3,.64,1),background .2s}
.daytoggle.on .dt-sw .sw{background:rgba(198,244,50,.16);border-color:rgba(198,244,50,.5)}
.daytoggle.on .dt-sw .sw i{left:22px;background:var(--lime)}
.dt-sw .lb{font-size:9px;color:var(--tx3);letter-spacing:.3px;transition:color .25s}
.daytoggle.on .dt-sw .lb{color:rgba(198,244,50,.75)}
/* 分区标题：替代原空白态的"今天休息"大块 */
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 9px}
.sect h3{font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:.2px}
.sect span{font-size:10px;color:var(--tx2);opacity:.8}
/* 添加动作：折叠条，避免与"今日动作"两套列表打架 */
.addbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:11px 13px;color:var(--tx2);font-size:12.5px;font-weight:600;margin-top:12px;transition:border-color .18s,color .18s,background .18s}
.addbar:active{border-color:rgba(198,244,50,.5);color:var(--lime)}
.addbar.open{border-style:solid;background:var(--card)}
.addbar .n{font-size:10px;color:var(--tx3);font-weight:400}

.tstats{display:flex;gap:8px;margin:10px 0 4px}
.tstat{flex:1;background:var(--card);border-radius:14px;padding:11px 10px;text-align:center}
.tstat b{font-size:18px;display:block;font-variant-numeric:tabular-nums}
.tstat span{font-size:9.5px;color:var(--tx3)}

/* 今日动作 */
.picklist{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pickbtn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;text-align:left;transition:background .15s,border-color .15s}
.pickbtn:active{background:rgba(198,244,50,.12);border-color:var(--lime)}
.pickbtn b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn span{font-size:9.5px;color:var(--tx2);opacity:.85}
.pickbtn.added{border-color:rgba(198,244,50,.45);background:rgba(198,244,50,.08)}
.pickbtn.added b{color:var(--lime)}
/* 休息日的可选动作：降权，别让休息页看起来像训练页 */
.pickbtn.ghost{background:transparent}
.pickbtn.ghost:active{background:rgba(198,244,50,.1)}
.exrow{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--card);border-radius:13px;margin-bottom:7px}
.exrow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exrow .st2{font-size:9.5px;color:var(--tx3);margin-top:2px;font-weight:400}
.exrow .sets2{font-size:11px;color:var(--tx2);background:var(--card2);padding:3px 9px;border-radius:8px;white-space:nowrap}
.exrow .x{color:var(--tx3);font-size:13px;padding:2px 4px}
.librow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.librow input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 11px;font-size:13px}
.librow input:focus{border-color:var(--lime);outline:none}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--lime);color:#111;padding:9px 18px;border-radius:20px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* settings sheet */
.srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px}
.srow .btn-s{background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:10px;padding:8px 14px;font-size:12px}
</style>
</head>
<body>

<div class="wrap">
  <div class="hd">
    <div class="brand" id="brand" onclick="toggleCal()" role="button" aria-label="展开月视图">
      <span class="mark">
        <svg viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="9.8" stroke="#c6f432" stroke-width="2.2" stroke-linecap="round"
                  stroke-dasharray="50.6 11" stroke-dashoffset="0" transform="rotate(-13 13 13)"/>
          <path d="M10.6 8.9h5.2M10.6 13.1h4.3M10.6 8.9v8.2" stroke="#eef1f6" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <div>
        <h1>FitTrack</h1>
        <div class="sub2" id="hdDate"></div>
      </div>
      <span class="chev">▼</span>
    </div>
    <button class="gear" onclick="openSettings()">⚙️</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="calwrap" id="calWrap">
    <div class="calbox" id="calBox"></div>
  </div>

  <!-- ===== 饮食页 ===== -->
  <div id="pg-diet">
    <div class="hero">
      <div class="ring">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="54" fill="none" stroke="#1e222a" stroke-width="10"/>
          <circle id="ringFg" cx="64" cy="64" r="54" fill="none" stroke="var(--lime)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/>
        </svg>
        <div class="rn"><b id="ringNum">0</b><span id="ringLbl">剩余大卡</span></div>
      </div>
      <div class="ml" id="macroBars"></div>

    </div>

    <div class="st"><h2>三餐</h2><span class="sub">每餐随时可记 · 点 ＋ 添加</span></div>
    <div id="meals"></div>

    <div class="st"><h2>执行项</h2><span class="sub">点开打卡</span></div>
    <div class="fold" id="foldSup">
      <div class="fh" onclick="this.parentElement.classList.toggle('open')"><h3>💊 补剂</h3><span class="badge" id="supBadge"></span></div>
      <div class="body" id="supList"></div>
    </div>
    <div class="fold" id="foldWater">
      <div class="fh" onclick="this.parentElement.classList.toggle('open')"><h3>💧 喝水</h3><span class="badge" id="waterBadge"></span></div>
      <div class="body">
        <div class="water"><span class="num" id="waterNum">0ml</span><div class="bar"><i id="waterBar" style="width:0%"></i></div></div>
        <div class="wbtns"><button class="wbtn" onclick="addWater(250)">+250ml</button><button class="wbtn" onclick="addWater(500)">+500ml</button><button class="wbtn" onclick="addWater(-250)">−250ml</button></div>
      </div>
    </div>
    <div class="fold" id="foldBed">
      <div class="fh" onclick="this.parentElement.classList.toggle('open')"><h3>🌙 睡前自检</h3><span class="badge" id="bedBadge"></span></div>
      <div class="body" id="bedList"></div>

    <div class="st"><h2>数据</h2><span class="sub">纯数据 JSON 导出</span></div>
    <div class="wbtns" style="margin-bottom:16px">
      <button class="wbtn" onclick="exportRange('week')">⬇ 导出本周</button>
      <button class="wbtn" onclick="exportRange('month')">⬇ 导出本月</button>
    </div>

  <!-- ===== 训练页 ===== -->
  <div id="pg-train" style="display:none">
    <div id="dayToggle"></div>
    <div id="trainBody"></div>
    <div id="sessArea"></div>

    <div class="st"><h2>动作库设置</h2><span class="sub">改名 · 组数 · 新增</span></div>
    <div class="fold" id="foldLib">
      <div class="fh" onclick="this.parentElement.classList.toggle('open')"><h3>🎯 我的动作</h3><span class="badge" id="libBadge"></span></div>
      <div class="body" id="libBody"></div>
    </div>

    <div class="st"><h2>数据</h2><span class="sub">纯数据 JSON 导出</span></div>
    <div class="wbtns" style="margin-bottom:16px">
      <button class="wbtn" onclick="exportRange('week')">⬇ 导出本周</button>
      <button class="wbtn" onclick="exportRange('month')">⬇ 导出本月</button>

</div>

    <button id="st-ai" onclick="setSrc('ai')">🤖 AI 结果粘贴</button>
    <button id="st-fr" onclick="setSrc('fr')">🔁 常吃</button>
  </div>

</div>

<!-- AI 确认屏 -->
<div class="sheet" id="cfmSheet">
  <div class="grab"></div>
  <h3>确认后入库 <span style="font-size:11px;color:var(--tx3);font-weight:400">（AI 估算必须过确认，可改）</span></h3>
  <div class="cfm" id="cfmList"></div>
  <button class="bigbtn" onclick="saveConfirm()">✓ 确认保存</button>

<!-- 设置 sheet -->
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h3>设置</h3>
  <div class="srow"><span>检查更新（APK 安装包）</span><button class="btn-s" id="updBtn" onclick="checkUpdate()">检查</button></div>
  <div class="srow" style="font-size:11px;color:var(--tx3)"><span>当前版本 <b id="appVer"></b></span><span id="updStatus"></span></div>
  <div class="srow"><span>数据备份（导出 JSON）</span><button class="btn-s" onclick="exportData()">导出</button></div>
  <div class="srow"><span>恢复备份</span><button class="btn-s" onclick="document.getElementById('impFile').click()">导入</button></div>
  <input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(this)">
  <div class="srow" style="font-size:11px;color:var(--tx3)">目标：70kg · 蛋白140g · 碳水315g · 脂肪63g · 2450kcal · 纤维25g · 水2L</div>
</div>

<div class="restchip" id="restChip"></div>
<div class="toast" id="toast"></div>

<script>
// ============ 常量 ============
const T = { kcal:2450, protein:140, carb:315, fat:63, fiber:25, water:2000 };
const MEALS = [
  {key:'b', name:'早餐', tgt:'蛋白30-40 · 碳水60-80 · 脂肪10-15', sug:()=>h()<10},
  {key:'l', name:'午餐', tgt:'蛋白40-45 · 碳水80-100 · 脂肪20', sug:()=>h()>=10&&h()<15},
  {key:'d', name:'晚餐', tgt:'蛋白35-40 · 碳水50-70 · 脂肪20', sug:()=>h()>=15&&h()<21},
  {key:'s', name:'加餐', tgt:'三餐不够时补 · 练后=增肌粉', sug:()=>h()>=21||h()<5}
];
const BED = ['蛋白质凑够140g','碳水：训练日拉高/休息日略降','纤维≥25g','喝水≥2L','补剂吃完'];
const SUP_T = [['t_fish','Swisse 鱼油 1粒','晚餐随餐'],['t_mass','增肌粉 1份','练后30min内'],['t_creat','肌酸片 6片','练后 · 与增肌粉同服'],['t_banana','练前香蕉(可选)','练前45-60min · 看饥饿度']];
const SUP_R = [['r_fish','Swisse 鱼油 1粒','晚餐随餐'],['r_creat','肌酸片 6片','推荐晚餐 · 每天必吃'],['r_mass','增肌粉 1份(按需)','三餐没达标才喝']];
const REST_SEC = 90;
const DEF_LIB = [
  {id:'l0', name:'杠铃卧推', sets:4}, {id:'l1', name:'哑铃肩推', sets:3},
  {id:'l2', name:'杠铃划船', sets:4}, {id:'l3', name:'高位下拉', sets:3},
  {id:'l4', name:'二头弯举', sets:3}, {id:'l5', name:'杠铃深蹲', sets:4},
  {id:'l6', name:'罗马尼亚硬拉', sets:3}, {id:'l7', name:'腿举', sets:3},
  {id:'l8', name:'腿弯举', sets:3}, {id:'l9', name:'卷腹', sets:3},
  {id:'l10', name:'侧平举', sets:3}, {id:'l11', name:'三头下压', sets:3}
];
const h = ()=>new Date().getHours();

// ============ 状态 ============
let S = load(), viewDate = todayKey(), pg = 'diet';
let viewAnchor = new Date();   // 周横条当前显示的所在周锚点
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateKey(offset){ const d=new Date(); d.setDate(d.getDate()+offset); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blankDay(){ return {meals:{b:[],l:[],d:[],s:[]}, sup:{}, bed:{}, water:0, workout:{}, train:false, ex:[]}; }
function load(){
  try{
    const raw = JSON.parse(localStorage.getItem('fittrack_v2')||'{}');
    raw.days = raw.days||{};
    if(!Array.isArray(raw.lib)) raw.lib = JSON.parse(JSON.stringify(DEF_LIB));
    return raw;
  }catch(e){ return {days:{}, lib:JSON.parse(JSON.stringify(DEF_LIB))}; }
}
function save(){ localStorage.setItem('fittrack_v2', JSON.stringify(S)); }
function D(){ if(!S.days[viewDate]) S.days[viewDate]=blankDay(); const d=S.days[viewDate]; if(!Array.isArray(d.ex)) d.ex=[]; return d; }
// 兼容旧版：没有 train 字段时，按旧排班推断一次（只读，不写库）
function isTrainDay(key){
  const dd=S.days[key];
  if(dd && typeof dd.train==='boolean') return dd.train;
  if(Array.isArray(S.schedule)){ const d=new Date(key+'T12:00:00'); const i=d.getDay()===0?6:d.getDay()-1; return S.schedule[i]!=='rest'; }
  // 旧数据若无 workout 记录则视为休息日
  return !!(dd && dd.workout && Object.keys(dd.workout).length);
}
function kcalOf(p,c,f){ return Math.round((+p||0)*4+(+c||0)*4+(+f||0)*9); }
// 条目级热量：AI/标签直读的热量(kc)优先，否则按 4/4/9 反算
function kcalOfE(e){ return e && +e.kc>0 ? Math.round(+e.kc) : kcalOf(e&&e.p, e&&e.c, e&&e.f); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
function esc(s){ return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// ============ 导航 ============
function go(p){
  pg=p;
  ['diet','train'].forEach(k=>{
    document.getElementById('pg-'+k).style.display = p===k?'':'none';
    document.getElementById('nv-'+k).classList.toggle('on',p===k);
  });
  if(p==='diet') renderDiet(); else renderTrain();
}
function selDay(key){ viewDate=key; libOpen=false; restAll=false; renderAll(); }

// ============ Day strip ============
function renderStrip(){
  const base = viewAnchor.getDay(), names=['一','二','三','四','五','六','日'];
  const todayIdx = base===0?6:base-1;
  const monOffset = -(todayIdx);
  const today = todayKey();
  document.getElementById('strip').innerHTML = names.map((n,i)=>{
    const key = dateKeyFrom(viewAnchor, monOffset+i);
    const t = dayTotalsFor(key);
    const st = dayStatus(key);
    const dayNum = +key.slice(8);
    const future = key > today;
    const pct = (t && t.n>0 && !future) ? Math.min(100, t.kcal/T.kcal*100) : 0;
    const cls = st.cls==='st-ok'?'ok':st.cls==='st-over'?'over':st.cls==='st-part'?'part':'';
    const tr = isTrainDay(key);
    return `<div class="dchip ${key===today?'today':''} ${key===viewDate?'sel':''} ${tr?'is-train':''}" onclick="selDay('${key}')">
      <div class="w" style="${tr?'color:var(--lime)':''}">${key===today?'今天':n}</div>
      <div class="d" style="${tr?'color:var(--lime);text-shadow:0 0 12px rgba(198,244,50,.45)':''}">${dayNum}</div>
      <div class="ebar ${cls}"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  const wd = new Date(viewDate+'T12:00:00');
  document.getElementById('hdDate').textContent = `${viewDate.slice(5).replace('-','/')} 周${'日一二三四五六'[wd.getDay()]}${viewDate===todayKey()?'':' · 回看'}`;
}
function dateKeyFrom(anchor, offset){ const d=new Date(anchor); d.setDate(d.getDate()+offset); return fmtKey(d); }

// ============ 月历（点击顶部品牌区原地展开） ============
let calOpen = false, calAnchor = new Date();
function toggleCal(){
  calOpen = !calOpen;
  const w = document.getElementById('calWrap'), b = document.getElementById('brand');
  b.classList.toggle('open', calOpen);
  if(calOpen){
    calAnchor = new Date(viewDate+'T12:00:00');
    renderCal();
    w.classList.add('open');
  } else {
    w.classList.remove('open');
  }
}
function calShift(n){
  calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth()+n, 1);
  renderCal();
}
function calToday(){ calAnchor = new Date(); renderCal(); }
function renderCal(){
  const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
  const first = new Date(y, m, 1);
  const startIdx = (first.getDay()+6)%7;           // 周一为第一列
  const days = new Date(y, m+1, 0).getDate();
  const mkey = d=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const today = todayKey();
  let cells = '';
  for(let i=0;i<startIdx;i++) cells += '<div class="cg-d blank"></div>';
  for(let d=1;d<=days;d++){
    const k = mkey(d), st = dayStatus(k), tr = isTrainDay(k);
    const t = dayTotalsFor(k);
    const future = k > today;
    const pct = (t && t.n>0 && !future) ? Math.min(100, t.kcal/T.kcal*100) : 0;
    const cls = st.cls==='st-ok'?'ok':st.cls==='st-over'?'over':st.cls==='st-part'?'part':'';
    cells += `<div class="cg-d ${st.cls} ${k===today?'today':''} ${k===viewDate?'sel':''}" onclick="calPick('${k}')">
      <div class="n">${d}</div>
      ${tr?'<span class="tr">练</span>':''}
      <div class="k">${st.kcal!==null?st.kcal:'—'}</div>
      <div class="ebar ${cls}"><i style="width:${pct}%"></i></div>
    </div>`;
  }
  const mPrefix = `${y}-${String(m+1).padStart(2,'0')}`;
  const trN = Object.keys(S.days).filter(k=>k.startsWith(mPrefix)&&isTrainDay(k)).length;
  const logN = Object.keys(S.days).filter(k=>k.startsWith(mPrefix)&&dayTotalsFor(k)&&dayTotalsFor(k).n>0).length;
  const wdNames = ['一','二','三','四','五','六','日'];
  document.getElementById('calBox').innerHTML =
    `<div class="calhead">
      <div class="mt">${y}年${m+1}月<span>训练 ${trN} · 记录 ${logN} 天</span></div>
      <div class="nav2"><button onclick="calShift(-1)">‹</button><button class="jm" onclick="calToday()">今</button><button onclick="calShift(1)">›</button></div>
    </div>
    <div class="cgrid">${wdNames.map(n=>`<div class="cg-h">${n}</div>`).join('')}${cells}</div>
    <div class="clegend"><span><i style="color:var(--lime)">■</i>达标</span><span><i style="color:var(--amber)">■</i>有记录</span><span><i style="color:var(--red)">■</i>超标</span><span><i style="color:var(--lime)">练</i>训练日</span></div>`;
}
function calPick(k){
  viewDate = k;
  calAnchor = new Date(k+'T12:00:00');
  renderAll(); renderCal();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ============ Hero ============
function mealTotals(key){ const es=D().meals[key]||[]; let p=0,c=0,f=0,fib=0,kcal=0; es.forEach(e=>{p+=+e.p||0;c+=+e.c||0;f+=+e.f||0;fib+=+e.fib||0;kcal+=kcalOfE(e);}); return {p,c,f,fib,kcal,n:es.length}; }
function dayTotals(){ let t={p:0,c:0,f:0,fib:0,kcal:0}; MEALS.forEach(m=>{const x=mealTotals(m.key); t.p+=x.p;t.c+=x.c;t.f+=x.f;t.fib+=x.fib;t.kcal+=x.kcal;}); return t; }
function dayTotalsFor(key){
  const dd=S.days[key]; if(!dd||!dd.meals) return null;
  const t={p:0,c:0,f:0,fib:0,kcal:0,n:0};
  MEALS.forEach(m=>(dd.meals[m.key]||[]).forEach(e=>{t.p+=+e.p||0;t.c+=+e.c||0;t.f+=+e.f||0;t.fib+=+e.fib||0;t.kcal+=kcalOfE(e);t.n++;}));
  return t;
}
function renderHero(){
  const t = dayTotals(), remain = Math.max(0, Math.round(T.kcal - t.kcal)), over = t.kcal>T.kcal;
  const pct = Math.min(1, t.kcal/T.kcal), C = 339.3;
  const fg = document.getElementById('ringFg');
  fg.style.strokeDashoffset = C*(1-pct);
  fg.style.stroke = over ? 'var(--red)' : 'var(--lime)';
  document.getElementById('ringNum').textContent = over ? '+'+Math.round(t.kcal-T.kcal) : remain;
  document.getElementById('ringLbl').textContent = over ? '超出大卡' : '剩余大卡';
  const bars = [
    ['蛋白', t.p, T.protein, 'var(--p-green)'],
    ['碳水', t.c, T.carb, 'var(--p-blue)'],
    ['脂肪', t.f, T.fat, 'var(--p-purple)'],
    ['纤维', t.fib, T.fiber, 'var(--green)']
  ];

// ---- 普适字段扫描：在任意一行里找出所有「营养字段=数字」对 ----
// 关键词覆盖：热量/卡路里/大卡/千卡/kcal → kc；千焦/kJ → 自动×4.184换算
// 蛋白质/protein；碳水(化合物)/carb；脂肪/fat；膳食纤维/纤维/fiber
const FIELD_DEFS=[
  ['kc',   /(?:热量|卡路里|大卡|千卡|kcal|calorie)/i],
  ['kj',   /(?:千焦|kJ)/i],
  ['p',    /(?:蛋白质|蛋白|protein)/i],
  ['c',    /(?:碳水化合物|碳水|carb)/i],
  ['f',    /(?:脂肪|fat)/i],
  ['fib',  /(?:膳食纤维|纤维|fiber)/i]
];
function scanFields(line){
  const marks=[];
  for(const [k,r] of FIELD_DEFS){
    const rr=new RegExp(r.source,'gi'); let m;
    while((m=rr.exec(line))) marks.push({k,i:m.index,end:m.index+m[0].length});
  }
  if(!marks.length) return null;
  marks.sort((a,b)=>a.i-b.i);
  const out={first:marks[0].i};
  for(let j=0;j<marks.length;j++){
    const seg=line.slice(marks[j].end, j+1<marks.length?marks[j+1].i:line.length);
    let nm=seg.match(/[-+]?\d+(?:\.\d+)?/);
    // 千焦数字常写在关键词前面（「600千焦」）→ 向前取最近的数
    if(!nm && marks[j].k==='kj'){
      const prevEnd = j>0 ? marks[j-1].end : 0;
      const before = line.slice(prevEnd, marks[j].i).match(/[-+]?\d+(?:\.\d+)?/g);
      if(before) nm=[before[before.length-1]];
    }
    if(nm && out[marks[j].k]===undefined) out[marks[j].k]=+nm[0];
  }
  // 千焦处理：若「热量」与「千焦」捕到同一个数字（如「热量 600千焦」）或无热量值 → 按千焦换算
  if(out.kj && (out.kc===undefined || out.kc===out.kj)){ out.kc=Math.round(out.kj*4.184); }
  return out;
}
function cleanFoodName(s){
  return String(s||'')
    .replace(/^\s*(?:\d{1,3}\s*[.．、)）]|\d{1,3}\s*\/\s*\d{1,3}|[#※★·•]|[①②③④⑤⑥⑦⑧⑨⑩⑪⑫])\s*/,'')
    .replace(/^[\s：:，,、\-~—]+\s*/,'')
    .replace(/[\s：:，,、~—]+$/,'')
    .trim();
}
function parseAI(){
  const raw = document.getElementById('aiText').value.trim();
  if(!raw){ toast('先粘贴内容'); return; }
  let items=[];
  try{
    const j = JSON.parse(raw);
    items = (Array.isArray(j)?j:[j]).map(x=>({
      food:String(x.food||x.name||'未命名'), p:+(x.p??x.protein??0)||0, c:+(x.c??x.carb??0)||0, f:+(x.f??x.fat??0)||0, fib:+(x.fib??x.fiber??0)||0, kc:+(x.kc??x.kcal??x.calories??0)||0
    }));
  }catch(e){
    // 普适文本解析：条目可跨多行（名称行 + 字段行），也兼容单行混排
    let cur=null;
    const flush=()=>{ if(cur){ items.push(cur); cur=null; } };
    raw.split(/\n+/).forEach(line0=>{
      const line=line0.trim(); if(!line) return;
      if(/^(合计|总计|小计|总共|共摄入|total)/i.test(line)) return;      // 汇总行跳过
      if(/^[-=_—~\s.。·]+$/.test(line)) return;                        // 分隔线跳过
      const f=scanFields(line);
      const rawName = f ? line.slice(0, f.first) : line;
      const name = cleanFoodName(rawName);
      if(f && !name){
        // 纯字段行 → 追加到当前条目（没有当前条目则新建未命名）
        if(!cur) cur={food:'未命名',p:0,c:0,f:0,fib:0,kc:0};
        ['p','c','f','fib','kc'].forEach(k=>{ if(f[k]!==undefined && !cur[k]) cur[k]=f[k]; });
        return;
      }
      // 有名称（或纯文本行）→ 开新条目，本行内附带的字段一并录入
      flush();
      cur={food:name||'未命名', p:0,c:0,f:0,fib:0,kc:0};
      if(f) ['p','c','f','fib','kc'].forEach(k=>{ if(f[k]!==undefined) cur[k]=f[k]; });
    });
    flush();
    items=items.filter(x=>x.food!=='未命名' || x.p||x.c||x.f||x.fib||x.kc);
  }
  if(!items.length){ toast('没解析出条目，检查格式'); return; }
  cfmItems = items; cfmMeal = logMeal;
  renderConfirm(); closeAllSheetsOnly(); show('cfmSheet');
}

}

const APP_VERSION='2.6.0';
const UPDATE_BASE = location.pathname.replace(/[^/]*$/, ''); // 站内相对路径
function verKey(v){ return v.split('.').map(n=>+n||0); }
function isNewer(a,b){ const x=verKey(a),y=verKey(b); for(let i=0;i<Math.max(x.length,y.length);i++){ if((y[i]||0)>(x[i]||0)) return true; if((y[i]||0)<(x[i]||0)) return false; } return false; }
let pendingApk=null;
async function checkUpdate(){
  const btn=document.getElementById('updBtn'), st=document.getElementById('updStatus');
  btn.textContent='检查中…'; st.textContent='';
  try{
    const res = await fetch(UPDATE_BASE+'version.json?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const info = await res.json();
    if(isNewer(APP_VERSION, info.version)){
      pendingApk = info.apk && !/^https?:/.test(info.apk) ? UPDATE_BASE+info.apk : info.apk;
      st.textContent = `发现新版 v${info.version}`;
      btn.textContent='⬇ 下载新版';
      btn.onclick = downloadUpdate;
      toast(`发现新版 v${info.version}`);
    } else {
      st.textContent = '已是最新';
      btn.textContent='检查';
      toast('✓ 已是最新版本');
    }
  }catch(e){
    st.textContent = '检查失败（需联网）';
    btn.textContent='检查';
    toast('检查失败，稍后再试');
  }
}
function downloadUpdate(){
  if(!pendingApk){ toast('先点「检查」'); return; }
  // 触发 APK 下载：浏览器环境直接下载；TWA 内则跳系统浏览器下载页
  const a=document.createElement('a'); a.href=pendingApk; a.download='fittrack.apk';

function exportRange(kind){

  const meta = on
    ? `${wdName}${isToday?' · 今天':''}${d.ex.length?'':' · 还没选动作'}`
    : `${wdName}${isToday?' · 今天':''} · 肌酸照吃，鱼油随餐`;

  // ---- ① 日期卡：大数字 + 状态词 + 开关（状态词全页只出现这一次）----
  document.getElementById('dayToggle').innerHTML = `
    <div class="daytoggle ${on?'on':''}">
      <div class="dt-top">
        <div class="dt-num">${dayNum}</div>
        <div class="dt-meta">
          <div class="dt-t"><span class="dot"></span>${on?'训练日':'休息日'}</div>
          <div class="dt-s">${meta}</div>
        </div>
        <button class="dt-sw" role="switch" aria-checked="${on}" aria-label="训练日开关" onclick="toggleTrainDay()">
          <span class="sw"><i></i></span>
          <span class="lb">训练</span>
        </button>
      </div>
    </div>`;

  // ---- ② 训练内容 ----
  const body = document.getElementById('trainBody');

  // 休息日：没有空白态，直接给可用动作（正常亮度，点了就是训练日）
  if(!on){
    const shown = restAll ? lib : lib.slice(0,4);
    body.innerHTML = `
      <div class="sect"><h3>想练就练</h3><span>${lib.length} 个动作</span></div>
      <div class="picklist">${shown.map(e=>{
        const i = lib.indexOf(e);
        return `<button class="pickbtn ghost" onclick="startFromRest(${i})"><b>${esc(e.name)}</b><span>${e.sets}×8 · 现在练</span></button>`;
      }).join('')}</div>
      ${lib.length>4?`<button class="addbar" onclick="restAll=!restAll;renderTrain()">
        <span>${restAll?'收起':'＋ 还有 '+(lib.length-4)+' 个动作'}</span><span class="n">${restAll?'':'展开全部'}</span>
      </button>`:''}`;
    document.getElementById('sessArea').innerHTML = '';
    renderLib();
    return;
  }

  const w = d.workout||{};
  let doneSets=0, vol=0;
  Object.values(w).forEach(b=>((b&&b.sets)||[]).forEach(x=>{ if(x.done){doneSets++; vol+=(+x.w||0)*(+x.r||0);} }));
  const allPlanned = d.ex.reduce((s,e)=>s+(+e.sets||4),0);

  body.innerHTML = `
    ${d.ex.length?`<div class="tstats">
      <div class="tstat"><b>${d.ex.length}</b><span>今日动作</span></div>
      <div class="tstat"><b>${doneSets}/${allPlanned}</b><span>完成组数</span></div>
      <div class="tstat"><b>${Math.round(vol)}</b><span>容量 kg</span></div>
    </div>`:''}
    ${d.ex.length?`
      <div class="sect" style="margin-top:15px"><h3>今日动作</h3><span>约 ${totalMin} 分钟</span></div>
      ${d.ex.map((e,ei)=>`<div class="exrow">
        <span style="width:16px;font-size:11px;color:var(--tx3);text-align:center">${ei+1}</span>
        <div class="nm">${esc(e.name)}<div class="st2">${prevPerformance(e.name)||'首次 · 无历史'}</div></div>
        <span class="sets2">${e.sets}×8</span>
        <button class="x" onclick="delEx(${ei})">✕</button>
      </div>`).join('')}
      ${sessionOn?''
        :`<button class="startbtn" onclick="startSession()" style="margin-top:10px">▶ 开始训练 · ${d.ex.length} 个动作</button>`}
    `:`<div class="sect"><h3>今日动作</h3><span>还没选 · 从下面挑</span></div>`}
    <button class="addbar ${libOpen?'open':''}" onclick="libOpen=!libOpen;renderTrain()">
      <span>${libOpen?'收起动作库':'＋ 添加动作'}</span><span class="n">${lib.length} 个动作</span>
    </button>
    ${libOpen?`<div class="picklist" style="margin-top:8px">${lib.map((e,i)=>{
      const added = d.ex.some(x=>x.id===e.id);
      return `<button class="pickbtn ${added?'added':''}" onclick="addEx(${i})"><b>${added?'✓ ':''}${esc(e.name)}</b><span>${e.sets}×8 · ${added?'已加入':'点击加入今日'}</span></button>`;
    }).join('')}</div>
    <div style="font-size:10px;color:var(--tx3);text-align:center;margin-top:8px">组数可在「动作库」里调整</div>`:''}`;

  document.getElementById('sessArea').innerHTML = sessionOn ? renderSession() : '';
  renderLib();
}

function renderLib(){
  const lib = S.lib||[];
  document.getElementById('libBadge').textContent = lib.length+'个';
  document.getElementById('libBody').innerHTML =
    lib.map((e,i)=>`<div class="librow">
      <input value="${esc(e.name)}" onchange="S.lib[${i}].name=this.value.trim()||S.lib[${i}].name;save();syncExName(${i});renderTrain()" placeholder="动作名">
      <input style="flex:0 0 62px;text-align:center" type="number" value="${e.sets}" onchange="S.lib[${i}].sets=Math.max(1,Math.min(20,+this.value||4));save();renderTrain()" title="组数">
      <span class="unitlbl" style="flex:0 0 auto">组</span>
      <button class="x" style="color:var(--tx3);padding:2px 4px" onclick="delLib(${i})">✕</button>
    </div>`).join('')
    + `<button class="minibtn" style="width:100%;margin-top:6px;padding:11px" onclick="addLib()">＋ 新增动作</button>
       <div style="font-size:10px;color:var(--tx3);margin-top:8px;line-height:1.6">新增的动作立刻出现在训练日的动作选择里 · 默认组数 4</div>`;
}
function addLib(){
  S.lib = S.lib||[];
  const id = 'c'+Date.now().toString(36);
  S.lib.push({id, name:'新动作', sets:4});
  save(); renderLib();
  // 聚焦到新增那一行的名称框
  setTimeout(()=>{
    const rows = document.querySelectorAll('#libBody .librow input');
    const el = rows[(S.lib.length-1)*2];
    if(el){ el.focus(); el.select(); }
  }, 30);
}
function delLib(i){
  const e = S.lib[i];
  S.lib.splice(i,1);
  // 同时从各天已选动作里移除
  Object.values(S.days).forEach(d=>{ if(Array.isArray(d.ex)) d.ex = d.ex.filter(x=>x.id!==e.id); });
  save(); renderTrain();
}
function syncExName(i){
  const e = S.lib[i]; if(!e) return;
  Object.values(S.days).forEach(d=>{ if(Array.isArray(d.ex)) d.ex.forEach(x=>{ if(x.id===e.id) x.name=e.name; }); });
  save();
}
function addEx(i){
  const e = S.lib[i]; if(!e) return;
  const d = D();
  if(d.ex.some(x=>x.id===e.id)){ toast('已在今日动作里'); return; }
  d.ex.push({id:e.id, name:e.name, sets:+e.sets||4});
  save(); renderTrain(); renderStrip();
  toast(`✓ 已加入 ${e.name} ${e.sets}×8`);
}
function delEx(ei){
  const d = D();
  const [rm] = d.ex.splice(ei,1);
  // 移除该动作在本次训练里的组记录
  if(rm && d.workout){ Object.keys(d.workout).forEach(k=>{ if(d.workout[k] && d.workout[k].name===rm.name) delete d.workout[k]; }); }
  save(); renderTrain();
}

function renderSession(){
  const d = D();
  const w = d.workout = d.workout||{};
  return `<div class="sess">
    <div class="st" style="margin:16px 0 8px"><h2 style="font-size:14px">🔴 训练中</h2><span class="sub">每记一组自动休息 ${REST_SEC}s</span></div>
    ${d.ex.map((e,ei)=>{
      const planned = +e.sets||4;
      let blk = w[ei];
      if(Array.isArray(blk)) blk = w[ei] = {name:e.name, sets:blk};
      if(!blk || !blk.sets || blk.name!==e.name) blk = w[ei] = {name:e.name, sets:Array.from({length:planned},()=>({w:'',r:'8',done:false}))};
      const arr = blk.sets;
      while(arr.length<planned) arr.push({w:'',r:'8',done:false});
      const doneN = arr.filter(x=>x.done).length;
      const prev = prevPerformance(e.name);
      return `<div class="exblk">
        <h4>${esc(e.name)}<span>${doneN}/${planned} 组${prev?' · 上次 '+esc(prev):''}</span></h4>
        ${arr.map((x,si)=>`<div class="setrow ${x.done?'done':''}">
          <span class="idx">${si+1}</span>
          <input type="number" inputmode="decimal" placeholder="重量" value="${x.w||''}" oninput="setVal(${ei},${si},'w',this.value)"><span class="unitlbl">kg</span>
          <input type="number" inputmode="numeric" placeholder="8" value="${x.r||''}" oninput="setVal(${ei},${si},'r',this.value)"><span class="unitlbl">次</span>
          <button class="done" onclick="completeSet(${ei},${si})">✓</button>
        </div>`).join('')}
      </div>`;
    }).join('')}
    <button class="ghostbtn" style="background:rgba(255,107,107,.14);color:#ff9b9b;border:1px solid rgba(255,107,107,.3)" onclick="endSession()">■ 结束训练</button>
    <div style="height:8px"></div>
  </div>`;
}
function prevPerformance(name){
  const keys=Object.keys(S.days).filter(k=>k<viewDate).sort();
  for(let i=keys.length-1;i>=0;i--){
    const d=S.days[keys[i]];
    if(!d||!d.workout) continue;
    for(const b of Object.values(d.workout)){
      if(!b||!b.sets||b.name!==name) continue;
      const ds=b.sets.filter(x=>x.done&&x.w);
      if(ds.length) return `${ds[ds.length-1].w}kg × ${ds[ds.length-1].r||'?'}次`;
    }
  }
  return null;
}
function setVal(ei,si,k,v){ const blk=(D().workout||{})[ei]; if(blk&&blk.sets&&blk.sets[si]) blk.sets[si][k]=v; save(); }
function completeSet(ei,si){
  const blk=(D().workout||{})[ei]; if(!blk||!blk.sets[si]) return;
  const x=blk.sets[si];
  x.done=!x.done;
  if(x.done && !x.r) x.r='8';
  if(x.done) startRest();
  save(); renderTrain();
}
function startRest(){
  restLeft=REST_SEC; const chip=document.getElementById('restChip');
  chip.classList.add('show'); clearInterval(restTimer);
  const paint=()=>chip.innerHTML=`⏱ <b>${restLeft}s</b> <span class="adj" onclick="restLeft+=30">+30s</span><span class="adj" onclick="restLeft=Math.max(0,restLeft-15)">-15s</span><span class="adj" onclick="clearInterval(restTimer);chipHide()">跳过</span>`;
  paint();
  restTimer=setInterval(()=>{ restLeft--; if(restLeft<=0){ clearInterval(restTimer); chipHide(); toast('⏱ 休息结束，下一组'); } else paint(); },1000);
}
function chipHide(){ const c=document.getElementById('restChip'); if(c) c.classList.remove('show'); }
function endSession(){
  const d=D(); let sets=0, vol=0;
  Object.values(d.workout||{}).forEach(b=>((b&&b.sets)||[]).forEach(x=>{ if(x.done){sets++; vol+=(+x.w||0)*(+x.r||0);} }));
  clearInterval(restTimer); chipHide(); sessionOn=false;
  save(); renderTrain(); closeAll();
  toast(`训练完成 ✓ ${sets}组 · 容量 ${Math.round(vol)}kg`);
}
function startSession(){ sessionOn=true; renderTrain(); window.scrollTo({top:0,behavior:'smooth'}); }

// ============ init ============
function renderAll(){
  renderStrip();
  if(pg==='diet') renderDiet();
  else renderTrain();
}
renderAll();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
